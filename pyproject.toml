[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-companion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["ollama>=0.4", "pydantic>=2", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
